name: Build

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compile AirBridge (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AirBridge.xcodeproj \
            -scheme AirBridge \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build/ci \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned app for signing and device verification
        run: ditto -c -k --keepParent 'build/ci/Build/Products/Release/Wield Host.app' build/Wield-Host-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Wield-Host-unsigned
          path: build/Wield-Host-unsigned.zip
