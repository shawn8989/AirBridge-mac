name: Build

on:
  push:
    branches: [main, "claude/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compile AirBridge (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify per-device TLS over real loopback sockets
        run: |
          swiftc -parse-as-library AirBridge/SecureTransport.swift Tests/SecureTransportChecks.swift -o /tmp/wield-secure-checks
          /tmp/wield-secure-checks

      - name: Verify shared-folder boundaries and file transfers
        run: |
          swiftc -parse-as-library AirBridge/SecureTransport.swift AirBridge/SharedFiles.swift Tests/SharedFileChecks.swift -o /tmp/wield-file-checks
          /tmp/wield-file-checks

      - name: Exercise the actual encrypted file client and server
        run: |
          swiftc -parse-as-library AirBridge/SecureTransport.swift AirBridge/SecurityManager.swift AirBridge/SharedProtocol.swift AirBridge/SharedFiles.swift AirBridge/SecureFileServer.swift Tests/FileConnection.swift Tests/FileIntegrationChecks.swift -o /tmp/wield-file-integration
          /tmp/wield-file-integration

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AirBridge.xcodeproj \
            -scheme AirBridge \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build/ci \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned app for signing and device verification
        run: ditto -c -k --keepParent 'build/ci/Build/Products/Release/Wield Host.app' build/Wield-Host-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Wield-Host-unsigned
          path: build/Wield-Host-unsigned.zip
